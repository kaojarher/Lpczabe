<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>開箱打殭屍 · LPC</title>
<style>
:root{
  --bg:#14170f; --panel:#1f231a; --panel2:#2a2f22; --line:#40463a;
  --green:#4f9a17; --green2:#2f6d0c; --lime:#8be34a; --gold:#ffd24a; --red:#e0483c; --txt:#f3f1e4;
  --ic:clamp(34px,10.5vw,54px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b0d08;color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
body{display:flex;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#2a3320 0%,#0b0d08 70%)}
#app{position:relative;width:100%;max-width:520px;height:100dvh;max-height:980px;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 60px #000a;overflow:hidden}
@media (min-width:560px){#app{margin:auto;height:min(100dvh,920px);border-radius:14px}}

/* banner */
#banner{flex:none;text-align:center;padding:8px 10px 6px;font-weight:900;font-style:italic;letter-spacing:.5px;line-height:1.05;font-size:clamp(17px,5.4vw,26px);text-transform:uppercase;
  color:#fff;-webkit-text-stroke:1px #1a1a8a;text-shadow:0 2px 0 #3b2bd6,0 0 6px #ff4fd8,0 0 12px #ff9a3c;background:linear-gradient(#2c3224,#1b1f15)}
#banner small{display:block;font-size:.72em}
/* stage */
#stage{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 4px;background:#262b1d}
#stageNum{font-weight:900;font-size:clamp(18px,5.4vw,26px);color:#b9b6a6;min-width:62px;text-align:center;text-shadow:0 2px 0 #000}
#track{position:relative;flex:1;height:14px}
#track .bar{position:absolute;left:0;right:0;top:5px;height:5px;background:#0a0a08;border-radius:3px}
#track .fill{position:absolute;left:0;top:5px;height:5px;background:linear-gradient(90deg,#ff8a30,#ffb040);border-radius:3px;width:0}
#track .node{position:absolute;top:2px;width:11px;height:11px;border-radius:50%;background:#0a0a08;border:2px solid #403f36;transform:translateX(-50%)}
#track .node.on{background:#ff8a30;border-color:#ffb040}
#track .knob{position:absolute;top:-2px;width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc070,#ff7a1a);box-shadow:0 0 8px #ff7a1a;transform:translateX(-50%);left:0}

/* battle */
#battle{position:relative;flex:1 1 auto;min-height:200px;background:#000;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation}
.side{position:absolute;right:8px;display:flex;flex-direction:column;gap:10px;align-items:center;top:10px;z-index:3}
.sbtn{position:relative;width:46px;height:46px;border-radius:12px;background:linear-gradient(#4a4f3e,#2a2e22);border:2px solid #686c58;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 #000a;cursor:pointer}
.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000a}
.sbtn.on{background:linear-gradient(#ffcf5a,#d28b14);border-color:#fff2b0}
.sbtn .lab{position:absolute;bottom:-14px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#e02c2c;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid #fff}
#idle{width:72px;height:72px;border-radius:50%;margin-top:6px;background:radial-gradient(circle at 40% 30%,#5a5a40,#23251a);border:3px solid #86876a;font-size:34px;flex-direction:column;line-height:1}
#idle .t{font-size:10px;font-weight:900;color:#fff;margin-top:1px;text-shadow:0 1px 2px #000}
#skill{position:absolute;right:12px;bottom:34px;width:58px;height:58px;border-radius:50%;z-index:3;border:3px solid #ffd24a;background:radial-gradient(circle at 40% 30%,#ff9a3c,#a8280a);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px #ff7a1a88;cursor:pointer;overflow:hidden}
#skill .cd{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}
#skill.rdy{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px #ffd24acc}}
#skill span{position:relative;z-index:1}

/* slots */
#slots{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#1b1e15}
.slot{position:relative;aspect-ratio:1/1.08;border-radius:9px;background:linear-gradient(#2c3123,#1d2016);border:2px solid #3b4033;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 2px 4px;cursor:pointer;overflow:hidden}
.slot.can{background:linear-gradient(#2e7d1c,#1d5710);border-color:#6fe041;box-shadow:0 0 10px #5fd24a55 inset}
.slot:active{transform:scale(.96)}

.slot .lv{position:relative;font-weight:900;font-size:clamp(12px,3.6vw,16px);color:#d7d4c0;text-shadow:0 1px 2px #000}
.slot .cost{position:relative;font-size:clamp(9px,2.8vw,12px);font-weight:800;color:#a8a691}
.slot.can .cost{color:#ffe98a}
.slot .tag{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;color:#9a9884}
.slot.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.12);filter:brightness(1.6)}}

/* chest/info row */
#info{flex:none;display:flex;gap:8px;align-items:stretch;padding:2px 8px 8px;background:#1b1e15}
#playbtn{flex:1;border:0;border-radius:12px;padding:10px 6px;font-size:clamp(17px,5.2vw,24px);font-weight:900;color:#fff;background:linear-gradient(#5aa51c,#3a7510);box-shadow:0 4px 0 #1f4506,0 0 0 2px #7acb36 inset;cursor:pointer;text-shadow:0 2px 0 #1f4506}
#playbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f4506,0 0 0 2px #7acb36 inset}
#playbtn:disabled{filter:grayscale(.8) brightness(.7)}
#playbtn small{display:block;font-size:.55em;font-weight:700;opacity:.9}
.stat{flex:none;min-width:30%;background:#252a1d;border:2px solid #3b4033;border-radius:12px;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;font-weight:800;font-size:clamp(12px,3.6vw,15px);line-height:1.35}
.stat b{color:var(--gold)}
.stat i{font-style:normal;color:#9fd3ff}

/* tabs */
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#0f110b;border-top:2px solid #2d3224;padding-bottom:env(safe-area-inset-bottom)}
.tab{position:relative;padding:8px 2px 6px;text-align:center;font-weight:900;font-size:clamp(11px,3.4vw,14px);color:#a7a592;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .e{font-size:clamp(18px,5.6vw,26px);line-height:1.1}
.tab.act{background:#d98a1f;color:#fff;text-shadow:0 1px 0 #7a4a08}
.tab.lock{opacity:.55}
.tab.lock::after{content:"🔒";position:absolute;top:2px;right:8px;font-size:12px}

/* toast & modal */
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,0);background:#000d;border:2px solid #6fe041;padding:8px 14px;border-radius:10px;font-weight:800;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;max-width:86%}
#toast.show{opacity:1;transform:translate(-50%,-8px)}
#modal{position:absolute;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center;padding:18px}
#modal.show{display:flex}
#mbox{width:100%;max-width:400px;max-height:84%;overflow:auto;background:linear-gradient(#2b3022,#1a1d14);border:2px solid #6a7058;border-radius:14px;padding:14px 14px 12px}
#mbox h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
#mbox h2 button{background:#3b4033;color:#fff;border:0;border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer}
.q{display:flex;align-items:center;gap:8px;background:#161910;border:1px solid #3b4033;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-weight:700}
.q .p{flex:1}.q .pg{display:block;height:6px;background:#0a0b07;border-radius:3px;margin-top:5px;overflow:hidden}.q .pg i{display:block;height:100%;background:linear-gradient(90deg,#ff8a30,#ffd24a)}
.q button,.mbtn{border:0;border-radius:9px;background:linear-gradient(#5aa51c,#3a7510);color:#fff;font-weight:900;padding:8px 12px;cursor:pointer;font-size:13px}
.q button:disabled{filter:grayscale(1) brightness(.6)}
#mbox p{font-size:12.5px;line-height:1.55;color:#cfcdb9;margin:6px 0}
#mbox a{color:#8be34a}
</style>
</head>
<body>
<div id="app">
  <div id="banner">快速升級裝備，幫我<br><small>擊倒這些殭屍！</small></div>
  <div id="stage">
    <div id="stageNum">1-1</div>
    <div id="track"><div class="bar"></div><div class="fill" id="fill"></div>
      <div class="node on" style="left:2%"></div><div class="node" id="n2" style="left:50%"></div><div class="node" id="n3" style="left:98%"></div>
      <div class="knob" id="knob"></div></div>
  </div>
  <div id="battle">
    <canvas id="cv"></canvas>
    <div class="side">
      <div class="sbtn" id="bQuest">📋<span class="lab">任務</span><span class="dot" id="qDot">!</span></div>
      <div class="sbtn" id="bSpeed">⏱<span class="lab" id="spdLab">x1</span></div>
      <div class="sbtn" id="bInfo" style="margin-top:6px">ℹ️<span class="lab">素材</span></div>
      <div class="sbtn" id="idle">🧰<span class="t">閒置獎勵</span><span class="dot" id="idleDot" style="top:2px;right:2px">!</span></div>
    </div>
    <div id="skill" class="rdy"><span>💥</span><div class="cd" id="skillCd"></div></div>
  </div>
  <div id="slots"></div>
  <div id="info">
    <button id="playbtn">🎁 開啟寶箱 <small id="chestTxt">5/5</small></button>
    <div class="stat"><span>💰 <b id="gold">0</b></span><span>⚔ <i id="power">0</i></span></div>
  </div>
  <div id="tabs">
    <div class="tab lock" data-t="market"><span class="e">🛒</span>商店</div>
    <div class="tab" data-t="enh"><span class="e">🔧</span>強化</div>
    <div class="tab act" data-t="battle"><span class="e">⚔️</span>戰鬥</div>
    <div class="tab lock" data-t="dun"><span class="e">🏚️</span>地城</div>
    <div class="tab lock" data-t="arena"><span class="e">🏟️</span>競技場</div>
  </div>
  <div id="toast"></div>
  <div id="modal"><div id="mbox"></div></div>
</div>

<script>
(function(){

const SAVE_KEY="lpc_zombie_v1";
let S=null;
function fresh(){return{gold:30,world:1,level:1,kills:0,lv:SLOTS.map(()=>1),chests:5,chestKills:0,idleAt:Date.now(),totalKills:0,upgrades:0,quest:{k:0,u:0,w:0,c:[0,0,0]},speed:1}}

const LV=id=>S.lv[SLOTS.findIndex(s=>s.id===id)];
function stats(){
  const atk=Math.round((6+LV("mace")*4+LV("gloves")*1.2)*(1+0.012*LV("ring")));
  const hp=Math.round(60+LV("helm")*10+LV("vest")*18+LV("pants")*12);
  return{atk,hp,crit:Math.min(.6,.05+LV("gloves")*.012),spd:Math.min(1.6,1+LV("boots")*.015),regen:LV("amulet")*.004,gold:1+LV("ring")*.04};
}
const idx=()=>(S.world-1)*10+S.level-1;
const isBoss=()=>S.level===10;
const needKills=()=>isBoss()?1:8;
const upCost=l=>Math.floor(8*Math.pow(1.21,l));
function power(){const s=stats();return Math.round(s.atk*5+s.hp*.6)}

/* ---------- DOM: slots ---------- */
const slotsEl=$("#slots");
const slotEls=SLOTS.map((sl,i)=>{
  const d=document.createElement("div");d.className="slot";
  d.innerHTML='<span class="tag">'+sl.name+'</span><div class="ico" style="background-position:calc(var(--ic) * -'+sl.ic+') 0"></div><div class="lv"></div><div class="cost"></div>';
  d.addEventListener("click",()=>upgrade(i));
  slotsEl.appendChild(d);return d;
});
function refreshSlots(){
  SLOTS.forEach((sl,i)=>{
    const d=slotEls[i],c=upCost(S.lv[i]);
    d.querySelector(".lv").textContent="Lv."+S.lv[i];
    d.querySelector(".cost").textContent="⬆ "+fmt(c);
    d.classList.toggle("can",S.gold>=c);
  });
  $("#gold").textContent=fmt(S.gold);
  $("#power").textContent=fmt(power());
  $("#chestTxt").textContent=S.chests+"/5";
  $("#playbtn").disabled=S.chests<=0;
}
function upgrade(i,silent){
  const c=upCost(S.lv[i]);
  if(S.gold<c){if(!silent)toast("金幣不足");return false}
  S.gold-=c;S.lv[i]++;S.upgrades++;S.quest.u++;
  const m=stats().hp;if(SLOTS[i].stat==="hp"){H.maxHp=m;H.hp=Math.min(H.hp+SLOTS[i].per,m)}
  H.maxHp=m;
  slotEls[i].classList.remove("pop");void slotEls[i].offsetWidth;slotEls[i].classList.add("pop");
  refreshSlots();refreshQuest();return true;
}
$("#playbtn").addEventListener("click",()=>{
  if(S.chests<=0)return;
  S.chests--;
  const i=Math.floor(Math.random()*SLOTS.length),n=1+Math.floor(Math.random()*3);
  S.lv[i]+=n;S.quest.c[0]++;
  H.maxHp=stats().hp;
  toast("🎁 "+SLOTS[i].name+" +"+n+" 級！");
  slotEls[i].classList.remove("pop");void slotEls[i].offsetWidth;slotEls[i].classList.add("pop");
  refreshSlots();save();
});

/* background: procedural ruined city */
const bgLayers=[];
function makeBg(){
  bgLayers.length=0;
  for(let L=0;L<3;L++){
    const arr=[];let x=0;
    while(x<1400){
      const w=rnd(28,70)*(1+L*.2),h=rnd(60,150)*(1+(2-L)*.25);
      arr.push({x,w,h,broken:Math.random()<.5,win:Math.floor(rnd(2,6))});
      x+=w+rnd(2,16);
    }
    bgLayers.push({arr,span:x});
  }
}
makeBg();
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,"#3a3f46");g.addColorStop(.55,"#7c7a70");g.addColorStop(1,"#a49a82");
  ctx.fillStyle=g;ctx.fillRect(0,0,logicW,300);
  const cols=["#565a5c","#46494a","#33373a"],par=[.12,.3,.55],base=[GROUND-70,GROUND-48,GROUND-24];
  bgLayers.forEach((ly,i)=>{
    ctx.fillStyle=cols[i];
    const off=(bgX*par[i])%ly.span;
    for(let rep=-1;rep<=Math.ceil(logicW/ly.span)+1;rep++){
      for(const b of ly.arr){
        const x=b.x-off+rep*ly.span;
        if(x>logicW||x+b.w<0)continue;
        const top=base[i]+60-b.h;
        ctx.fillRect(x,top,b.w,b.h+40);
        if(b.broken){ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+b.w*.3,top);ctx.lineTo(x+b.w*.55,top+14);ctx.lineTo(x+b.w*.8,top);ctx.closePath();ctx.fill();ctx.fillStyle=cols[i]}
        ctx.fillStyle="#0006";
        for(let r=0;r<b.win;r++){ctx.fillRect(x+4,top+8+r*18,b.w-8,6)}
        ctx.fillStyle=cols[i];
      }
    }
  });
  // haze
  const hz=ctx.createLinearGradient(0,GROUND-90,0,GROUND-10);hz.addColorStop(0,"#d8cfb600");hz.addColorStop(1,"#d8cfb655");
  ctx.fillStyle=hz;ctx.fillRect(0,GROUND-90,logicW,80);
  // road
  const rg=ctx.createLinearGradient(0,GROUND-12,0,300);rg.addColorStop(0,"#4a4a48");rg.addColorStop(1,"#232321");
  ctx.fillStyle=rg;ctx.fillRect(0,GROUND-12,logicW,300);
  ctx.fillStyle="#1a1a18";ctx.fillRect(0,GROUND-14,logicW,3);
  ctx.fillStyle="#d8b84a";
  const dash=60,off2=(bgX*1.1)%(dash*2);
  for(let x=-dash*2-off2;x<logicW+dash;x+=dash*2)ctx.fillRect(x,GROUND+22,dash,5);
  ctx.fillStyle="#cfcfc4";
  for(let x=-off2*1.6;x<logicW+60;x+=140)ctx.fillRect(x,GROUND+54,50,3);
  // vignette
  const v=ctx.createRadialGradient(logicW/2,150,80,logicW/2,150,Math.max(logicW,300)*.75);
  v.addColorStop(0,"#0000");v.addColorStop(1,"#000a");
  ctx.fillStyle=v;ctx.fillRect(0,0,logicW,300);
}

/* sprite draw with optional flash */
function spr(img,sx,sy,sw,sh,dx,dy,dw,dh,flip,flash,alpha){
  ctx.save();
  if(alpha!=null)ctx.globalAlpha=alpha;
  let src=img,ssx=sx,ssy=sy;
  if(flash>0){
    tctx.clearRect(0,0,192,192);tctx.drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
    tctx.globalCompositeOperation="source-atop";tctx.fillStyle="rgba(255,255,255,"+Math.min(.85,flash*4)+")";tctx.fillRect(0,0,sw,sh);tctx.globalCompositeOperation="source-over";
    src=tmp;ssx=0;ssy=0;
  }
  if(flip){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(src,ssx,ssy,sw,sh,0,0,dw,dh)}
  else ctx.drawImage(src,ssx,ssy,sw,sh,dx,dy,dw,dh);
  ctx.restore();
}

/* enemy factory */
function spawnEnemy(boss,xOff){
  const i=idx();
  const typ=boss?"boss":(Math.random()<.5?"z1":"z2");
  const hpv=Math.floor((24+i*1)*Math.pow(1.115,i)*(boss?9:1));
  enemies.push({type:typ,boss,x:logicW+50+xOff,hp:hpv,maxHp:hpv,state:"walk",t:rnd(0,3),hitDone:false,flash:0,dead:0,
    scale:boss?2.6:rnd(1.45,1.7),speed:(boss?20:rnd(26,40)),dmg:Math.floor((4+i*.6)*Math.pow(1.095,i)*(boss?2.2:1)),reward:Math.ceil((4+i)*Math.pow(1.105,i)*(boss?10:1)),knock:0});
}
function spawnWave(){
  if(isBoss()){spawnEnemy(true,0);return}
  const n=Math.min(3,1+Math.floor(idx()/6));
  for(let k=0;k<n;k++)spawnEnemy(false,k*58);
}

/* floating text & fx */
function addDmg(x,y,t,col,big){dmgTxt.push({x,y,t,col,big,life:.9})}
function addSpark(x,y,col,n){for(let i=0;i<n;i++)fx.push({k:"p",x,y,vx:rnd(-90,90),vy:rnd(-130,-20),life:rnd(.3,.6),col})}

/* ---------- main loop ---------- */
let last=0,acc=0;
const ANIM={walk:{row:0,n:9,fps:10},slash:{row:1,n:6,fps:11},hurt:{row:2,n:6,fps:9}};
function heroFrame(){const a=ANIM[H.state==="atk"?"slash":H.state==="dead"?"hurt":"walk"];return{a,f:Math.floor(H.t*a.fps*stats().spd)%a.n}}

function update(dt){
  const st=stats();
  H.maxHp=st.hp;
  if(skillCd>0)skillCd=Math.max(0,skillCd-dt);
  if(H.flash>0)H.flash-=dt;
  if(H.shake>0)H.shake-=dt;
  H.t+=dt;
  // hero regen
  if(H.state!=="dead"&&H.hp<H.maxHp){H.hp=Math.min(H.maxHp,H.hp+H.maxHp*(.004+st.regen)*dt)}
  if(H.state==="dead"){
    H.dead+=dt;
    if(H.dead>1.8){H.state="walk";H.hp=H.maxHp;S.kills=0;enemies=[];spawnT=1;toast("你倒下了… 重新挑戰這一關");H.dead=0}
    return;
  }
  const range=82;
  // find target
  let tgt=null;
  for(const e of enemies){if(e.state!=="dead"&&e.x-H.x<range+e.scale*14&&(!tgt||e.x<tgt.x))tgt=e}
  // hero state
  if(tgt){
    if(H.state!=="atk"){H.state="atk";H.t=0;H.hitDone=false}
    const a=ANIM.slash,f=Math.floor(H.t*a.fps*st.spd);
    if(f>=4&&!H.hitDone){
      H.hitDone=true;
      let crit=Math.random()<st.crit,d=Math.round(st.atk*rnd(.9,1.1)*(crit?2:1));
      hitEnemy(tgt,d,crit);
    }
    if(f>=a.n){H.t=0;H.hitDone=false}
  }else{
    if(H.state!=="walk"){H.state="walk";H.t=0}
    bgX+=44*dt*st.spd;
  }
  // enemies
  for(const e of enemies){
    e.t+=dt;if(e.flash>0)e.flash-=dt;
    if(e.state==="dead"){e.dead+=dt;continue}
    if(e.knock>0){e.x+=e.knock*dt*60;e.knock=Math.max(0,e.knock-dt*14)}
    const stop=H.x+34+e.scale*10;
    if(e.state==="walk"){
      if(e.x>stop){e.x-=e.speed*dt+(tgt?0:44*dt*st.spd*.4)}
      else{e.state="atk";e.t=0;e.hitDone=false}
    }else if(e.state==="atk"){
      const a=ANIM.slash,f=Math.floor(e.t*a.fps*.8);
      if(f>=4&&!e.hitDone){e.hitDone=true;hurtHero(e.dmg)}
      if(f>=a.n){e.t=-.35;e.hitDone=false;if(e.x>stop+14)e.state="walk"}
    }
  }
  // cleanup
  enemies=enemies.filter(e=>!(e.state==="dead"&&e.dead>1.1));
  // spawn
  if(enemies.filter(e=>e.state!=="dead").length===0&&S.kills<needKills()){
    spawnT-=dt;
    if(spawnT<=0){spawnWave();spawnT=.6}
  }
  // fx
  fx.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt});fx=fx.filter(p=>p.life>0);
  dmgTxt.forEach(d=>{d.life-=dt;d.y-=32*dt});dmgTxt=dmgTxt.filter(d=>d.life>0);
  // idle dot
  $("#idleDot").style.display=idlePending()>=20?"flex":"none";
}
function hitEnemy(e,d,crit){
  if(e.state==="dead")return;
  e.hp-=d;e.flash=.18;e.knock=e.boss?1.2:3.5;
  addDmg(e.x,GROUND-90*(e.scale/1.6),String(fmt(d)),crit?"#ffd24a":"#fff",crit);
  addSpark(e.x-6,GROUND-40,crit?"#ffd24a":"#ff7a5a",crit?10:5);
  if(e.hp<=0){
    e.state="dead";e.dead=0;e.t=0;
    const g=Math.ceil(e.reward*stats().gold);S.gold+=g;S.totalKills++;S.quest.k++;
    addDmg(e.x,GROUND-120,"+"+fmt(g),"#8be34a",false);
    S.chestKills++;if(S.chestKills>=8&&S.chests<5){S.chests++;S.chestKills=0}
    S.kills++;
    if(S.kills>=needKills())advance();
    refreshSlots();refreshQuest();
  }
}
function hurtHero(d){
  if(H.state==="dead")return;
  H.hp-=d;H.flash=.2;H.shake=.18;
  addDmg(H.x,GROUND-110,"-"+fmt(d),"#ff6a5a",false);
  addSpark(H.x+14,GROUND-45,"#e0483c",5);
  if(H.hp<=0){H.hp=0;H.state="dead";H.t=0;H.dead=0}
}
function advance(){
  S.quest.w++;
  let msg;
  if(S.level>=10){S.world++;S.level=1;msg="🎉 進入第 "+S.world+" 區！";S.chests=5}
  else{S.level++;msg="通過！前往 "+S.world+"-"+S.level}
  S.kills=0;spawnT=1.1;toast(msg);save();
  H.hp=Math.min(H.maxHp,H.hp+H.maxHp*.25);
}
function castSkill(){
  if(skillCd>0||H.state==="dead")return;
  skillCd=SKILL_CD;
  const d=Math.round(stats().atk*4);
  fx.push({k:"ring",x:H.x+40,y:GROUND-30,life:.5,max:.5});
  H.shake=.25;
  enemies.forEach(e=>{if(e.state!=="dead"&&e.x<logicW+10)hitEnemy(e,d+Math.round(rnd(0,d*.2)),true)});
  toast("💥 破碎重擊！");
}
$("#skill").addEventListener("click",castSkill);
cv.addEventListener("click",castSkill);

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cv.width,cv.height);
  let sx=0,sy=0;
  if(H.shake>0){sx=rnd(-3,3);sy=rnd(-2,2)}
  ctx.setTransform(PX,0,0,PX,sx*PX*.5,sy*PX*.5);
  ctx.imageSmoothingEnabled=false;
  drawBg();
  // gather drawables
  const list=enemies.slice().sort((a,b)=>a.x-b.x);
  // hero shadow
  shadow(H.x+10,GROUND+2,34);
  // enemies
  for(const e of list){
    shadow(e.x,GROUND+2,22*e.scale);
    const key=e.type,img=IM[key],sc=e.scale*1.0;
    let row,n,fps,f;
    if(e.state==="dead"){row=2;n=6;fps=10;f=Math.min(5,Math.floor(e.dead*fps))}
    else if(e.state==="atk"){row=1;n=6;fps=11*.8;f=Math.max(0,Math.floor(Math.max(e.t,0)*fps))%n}
    else{row=0;n=9;fps=10;f=Math.floor(e.t*fps)%n}
    const dw=64*sc,dh=64*sc;
    const al=e.state==="dead"?Math.max(0,1-Math.max(0,e.dead-.6)/.5):1;
    spr(img,f*64,row*64,64,64,e.x-dw/2,GROUND-58*sc,dw,dh,true,e.flash,al);
    if(e.state!=="dead"){
      const bw=34*(e.boss?1.8:1),bx=e.x-bw/2,by=GROUND-64*sc-8;
      ctx.fillStyle="#000a";ctx.fillRect(bx-1,by-1,bw+2,6);
      ctx.fillStyle="#3a0f0c";ctx.fillRect(bx,by,bw,4);
      ctx.fillStyle="#e0483c";ctx.fillRect(bx,by,bw*Math.max(0,e.hp/e.maxHp),4);
    }
  }
  // hero (192px frame)
  {
    const hf=heroFrame(),a=hf.a,sc=1.62,dw=192*sc,dh=192*sc;
    let f=hf.f;
    if(H.state==="dead")f=Math.min(5,Math.floor(H.dead*9));
    // feet at ~y=122 in the 192 frame
    spr(IM.hero,f*192,a.row*192,192,192,H.x-96*sc,GROUND-122*sc,dw,dh,false,H.flash,H.state==="dead"?Math.max(.25,1-Math.max(0,H.dead-.8)):1);
  }
  // fx
  for(const p of fx){
    if(p.k==="ring"){const t=1-p.life/p.max;ctx.strokeStyle="rgba(255,210,74,"+(1-t)+")";ctx.lineWidth=6*(1-t)+1;ctx.beginPath();ctx.ellipse(p.x+t*80,p.y,40+t*220,16+t*40,0,0,7);ctx.stroke()}
    else{ctx.fillStyle=p.col;ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1}
  }
  ctx.textAlign="center";
  for(const d of dmgTxt){
    ctx.globalAlpha=Math.min(1,d.life*2);
    ctx.font="900 "+(d.big?22:15)+"px system-ui,sans-serif";
    ctx.lineWidth=4;ctx.strokeStyle="#000";ctx.strokeText(d.t,d.x,d.y);
    ctx.fillStyle=d.col;ctx.fillText(d.t,d.x,d.y);ctx.globalAlpha=1;
  }
  // hero HP bar
  const bw=Math.min(190,logicW*.5),bx=8,by=278;
  ctx.fillStyle="#000b";ctx.fillRect(bx-2,by-2,bw+4,16);
  ctx.fillStyle="#17220f";ctx.fillRect(bx,by,bw,12);
  const r=Math.max(0,H.hp/H.maxHp);
  ctx.fillStyle=r>.35?"#4cc42a":"#e0483c";ctx.fillRect(bx,by,bw*r,12);
  ctx.fillStyle="#fff";ctx.font="900 11px system-ui,sans-serif";ctx.textAlign="center";
  ctx.lineWidth=3;ctx.strokeStyle="#000";const tx=Math.ceil(H.hp)+"/"+H.maxHp;
  ctx.strokeText(tx,bx+bw/2,by+10);ctx.fillText(tx,bx+bw/2,by+10);
  // stage text on battle area when boss
  if(isBoss()){ctx.font="900 14px system-ui,sans-serif";ctx.fillStyle="#ff6a5a";ctx.strokeStyle="#000";ctx.lineWidth=3;ctx.textAlign="center";ctx.strokeText("BOSS",logicW/2,40);ctx.fillText("BOSS",logicW/2,40)}
}
function shadow(x,y,w){ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(x,y,w,w*.22,0,0,7);ctx.fill()}

/* HUD refresh */
let hudT=0;
function hud(dt){
  hudT-=dt;if(hudT>0)return;hudT=.15;
  $("#stageNum").textContent=S.world+"-"+S.level;
  const r=Math.min(1,S.kills/needKills());
  $("#fill").style.width=(r*96+2)+"%";
  $("#knob").style.left=(r*96+2)+"%";
  $("#n2").classList.toggle("on",r>=.5);$("#n3").classList.toggle("on",r>=1);
  $("#skillCd").style.height=(skillCd/SKILL_CD*100)+"%";
  $("#skill").classList.toggle("rdy",skillCd<=0);
  // affordability only changes with gold; cheap to refresh
  SLOTS.forEach((sl,i)=>slotEls[i].classList.toggle("can",S.gold>=upCost(S.lv[i])));
  $("#gold").textContent=fmt(S.gold);$("#power").textContent=fmt(power());$("#chestTxt").textContent=S.chests+"/5";
  $("#playbtn").disabled=S.chests<=0;
}

function loop(ts){
  if(!last)last=ts;
  let dt=Math.min(.05,(ts-last)/1000);last=ts;
  const steps=S.speed;
  for(let i=0;i<steps;i++)update(dt);
  draw();hud(dt);
  requestAnimationFrame(loop);
}
let saveI=0;
function start(){
  S=load();
  const away=(Date.now()-S.idleAt);
  $("#spdLab").textContent="x"+S.speed;$("#bSpeed").classList.toggle("on",S.speed===2);
  H.maxHp=stats().hp;H.hp=H.maxHp;
  resize();refreshSlots();refreshQuest();
  if(away>60000){const g=idlePending();if(g>=5)setTimeout(()=>toast("🧰 閒置獎勵可領取：+"+fmt(g)),600)}
  setInterval(save,5000);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
  window.addEventListener("pagehide",save);
  requestAnimationFrame(loop);
}
})();
</script>
